<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>모눈 습관 트래커</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one notebook page on grid paper — month title, coloured-in tracker grid, sleep log, then the stats charts */
:root{
  --paper:#fbfaf6; --grid:#dfe5ea; --ink:#26292e; --muted:#7a828c; --line:#c7cfd7;
  --cell-bg:#ffffffb0; --accent:#e86fa8; --hi:#fff3a8; --sun:#d9534f; --card:#ffffffd9;
  --hand:"Gaegu","Nanum Pen Script",cursive; --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --cell:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1f26; --grid:#262c35; --ink:#e8e6e1; --muted:#949ca7; --line:#3a424e;
  --cell-bg:#22272fcc; --accent:#f08cbd; --hi:#5a5220; --sun:#f07a76; --card:#20252dee; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1f26; --grid:#262c35; --ink:#e8e6e1; --muted:#949ca7; --line:#3a424e;
  --cell-bg:#22272fcc; --accent:#f08cbd; --hi:#5a5220; --sun:#f07a76; --card:#20252dee; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
.page{max-width:1100px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.month{display:flex;align-items:center;gap:6px}
.month h1{font-family:var(--hand);font-weight:700;font-size:clamp(44px,9vw,76px);line-height:.9;margin:0;letter-spacing:.01em}
.month h1 small{font-size:.38em;font-weight:400;color:var(--muted);margin-left:8px}
button,select,input{font:inherit;color:inherit}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:3px 9px 4px 8px;padding:5px 12px;cursor:pointer;font-family:var(--hand);font-size:19px;line-height:1.1}
.btn:hover{background:var(--hi)}
.btn:focus-visible,.cell:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default;background:var(--card)}
.nav{font-size:26px;padding:0 10px;border-radius:50%}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:12px;color:var(--muted)}
h2{font-family:var(--hand);font-size:28px;margin:0 0 8px;font-weight:700;display:inline-block;
  background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}
section{min-width:0}
.scroll{overflow-x:auto;padding-bottom:6px}
table.tracker{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tracker th,.tracker td{padding:0}
.tracker thead th{font-family:var(--hand);font-weight:400;font-size:15px;width:var(--cell);min-width:var(--cell);text-align:center;color:var(--muted);line-height:1}
.tracker thead th.today .dn{background:var(--accent);color:#fff;border-radius:50%;display:inline-block;width:20px;height:20px;line-height:20px}
.tracker thead th.sun{color:var(--sun)}
.tracker th.name{position:sticky;left:0;z-index:2;background:var(--paper);text-align:left;font-family:var(--hand);font-size:21px;font-weight:400;
  padding-right:10px;white-space:nowrap;border-bottom:1.5px solid var(--ink);min-width:120px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tracker th.name .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.cell{-webkit-user-select:none;user-select:none;display:block;width:var(--cell);height:var(--cell);border:1px solid var(--line);margin:-.5px;background:var(--cell-bg);cursor:pointer;padding:0;position:relative}
.cell.on{border-color:color-mix(in srgb,var(--c) 70%,var(--ink));
  background:
   repeating-linear-gradient(var(--a,45deg),var(--c) 0 1.6px,transparent 1.6px 4.2px),
   repeating-linear-gradient(calc(var(--a,45deg) - 90deg),color-mix(in srgb,var(--c) 70%,transparent) 0 1px,transparent 1px 6px),
   color-mix(in srgb,var(--c) 38%,var(--paper));
  animation:pop .18s ease-out}
.cell.future{opacity:.55}
.cell:hover{outline:1.5px dashed var(--ink);outline-offset:-3px}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
td.count{font-family:var(--hand);font-size:18px;text-align:center;color:var(--muted)}
tr.sum td{font-family:var(--hand);font-size:17px;text-align:center;color:var(--ink);padding-top:4px}
tr.sum th{font-family:var(--hand);font-weight:400;font-size:17px;text-align:right;padding-right:10px;color:var(--muted);position:sticky;left:0;background:var(--paper)}
.edit-row{display:flex;gap:6px;align-items:center}
.edit-row input{width:130px;border:none;border-bottom:1.5px dashed var(--ink);background:transparent;font-family:var(--hand);font-size:19px;padding:0 2px}
.x{border:none;background:none;cursor:pointer;color:var(--sun);font-size:18px;padding:0 4px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:24px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:4px 14px 6px 12px;padding:14px 16px;min-width:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.stat b{display:block;font-family:var(--hand);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
svg text{font-family:var(--hand);fill:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(70px,120px) 1fr 42px;gap:8px;align-items:center;font-family:var(--hand);font-size:18px;margin:5px 0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--cell-bg)}
.hbar .fill{height:100%;background:repeating-linear-gradient(45deg,var(--c) 0 1.6px,transparent 1.6px 4px),color-mix(in srgb,var(--c) 40%,var(--paper));transition:width .3s}
.hbar .pct{text-align:right;font-variant-numeric:tabular-nums}
.sleepform{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-family:var(--hand);font-size:19px}
.sleepform select{border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:2px 4px;font-family:var(--body);font-size:14px}
#sleepSvg .col{cursor:pointer}
#sleepSvg .col:hover rect{fill:var(--hi);opacity:.6}
@media (prefers-reduced-motion:reduce){.cell.on{animation:none}.hbar .fill{transition:none}}
</style>

<div class="page">
  <header>
    <div class="month">
      <button class="btn nav" id="prev" aria-label="이전 달">‹</button>
      <h1 id="mTitle">10월</h1>
      <button class="btn nav" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="tools">
      <span class="status" id="status">불러오는 중…</span>
      <button class="btn" id="undoBtn" title="되돌리기 (Ctrl+Z)" disabled>↶ 되돌리기</button>
      <button class="btn" id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)" disabled>↷</button>
      <button class="btn" id="exportBtn" title="기록을 파일로 저장">백업</button>
      <label class="btn" for="importFile" title="백업 파일 불러오기">복원</label><input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn" id="editBtn">습관 편집</button>
    </div>
  </header>

  <section>
    <h2>HABIT TRACKER</h2>
    <div class="scroll"><table class="tracker" id="tracker"></table></div>
    <p class="hint" id="hint">칸을 누르면 색이 칠해지고, 한 번 더 누르면 지워져요. 마우스로 끌면 여러 칸을 한 번에 칠하거나 지울 수 있고, Ctrl+Z로 되돌릴 수 있어요.</p>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>하루에 몇 개 지켰나</h2>
      <div class="stats" id="stats"></div>
      <div class="scroll"><svg id="dayChart" role="img" aria-label="날짜별 지킨 습관 개수 꺾은선 그래프"></svg></div>
    </div>
    <div class="card">
      <h2>습관별 달성률</h2>
      <div id="habitBars"></div>
    </div>
  </section>

  <section class="card">
    <h2>SLEEP LOG ☾</h2>
    <div class="scroll"><svg id="sleepSvg" role="img" aria-label="수면 기록"></svg></div>
    <form class="sleepform" id="sleepForm">
      <label><select id="sDay"></select>일</label>
      <label>잠든 시간 <select id="sBed"></select></label>
      <label>일어난 시간 <select id="sWake"></select></label>
      <button class="btn" type="submit">기록</button>
      <button class="btn" type="button" id="sClear">지우기</button>
      <span class="status" id="sAvg"></span>
    </form>
  </section>
</div>

<script>
(function(){
const PALETTE=['#5fb8d0','#5b8def','#8a72ee','#3fb37f','#94c84a','#e9bd2f','#f0904a','#e55a5a','#e76fa8','#b06ad9'];
const WD=['일','월','화','수','목','금','토'];
const DEFAULT_HABITS=['잠들기 1시간 전 폰 X','아침 스트레칭','스킨케어','영어 회화','100문장 쓰기','블로그','독서','물 2L'];
// sleep axis: 20:00 → 12:00 next day, in 30-min steps (0..32)
const S0=20*60, SPAN=16*60;

const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let habits=null; // [{id,name}]
const months={};  // key -> {c:{hid:[days]}, s:{day:[bedStep,wakeStep]}}
let editing=false, store={kind:'local'};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkey=()=>`m-${view.y}-${String(view.m+1).padStart(2,'0')}`;
const dim=()=>new Date(view.y,view.m+1,0).getDate();
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- storage: per-person private db, fallback to this browser ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem('ht:'+k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('ht:'+k,JSON.stringify(v))}catch(e){}}
async function load(k){
  if(store.kind==='db'){
    try{const s=await store.db.doc(`data/users/${store.uid}/${k}`).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null}
    catch(e){return lsGet(k)}
  }
  return lsGet(k);
}
const timers={}, busy={}, pending={};
function save(k,v){
  lsSet(k,v);
  if(store.kind!=='db') return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>flush(k,v),600);
  setStatus('저장 중…');
}
async function flush(k,v){
  if(busy[k]){pending[k]=v;return}
  busy[k]=true;
  try{await store.db.doc(`data/users/${store.uid}/${k}`).set(v);setStatus('저장됨')}
  catch(e){setStatus('저장 실패 · 이 브라우저에만 남아 있어요')}
  busy[k]=false;
  if(pending[k]){const n=pending[k];delete pending[k];flush(k,n)}
}
function setStatus(t){$('status').textContent=t}

async function initStore(){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const id=user?await user.id():null;
      if(db&&id){store={kind:'db',db,uid:id};return}
    }
  }catch(e){}
  store={kind:'local'};
}

async function ensureMonth(){
  const k=mkey();
  if(!months[k]) months[k]=(await load(k))||{c:{},s:{}};
  months[k].c=months[k].c||{}; months[k].s=months[k].s||{};
  return months[k];
}

/* ---------- render ---------- */
function isToday(d){return view.y===now.getFullYear()&&view.m===now.getMonth()&&d===now.getDate()}
function isFuture(d){return new Date(view.y,view.m,d)>new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function color(i){return PALETTE[i%PALETTE.length]}

function render(){
  const M=months[mkey()], n=dim();
  $('mTitle').innerHTML=`${view.m+1}월<small>${view.y}</small>`;
  // header
  let h='<thead><tr><th class="name" style="border:none"></th>';
  for(let d=1;d<=n;d++){
    const wd=new Date(view.y,view.m,d).getDay();
    h+=`<th class="${isToday(d)?'today':''} ${wd===0?'sun':''}"><span class="dn">${d}</span><br>${WD[wd]}</th>`;
  }
  h+='<th style="width:40px"></th></tr></thead><tbody>';
  habits.forEach((hb,i)=>{
    const done=new Set(M.c[hb.id]||[]);
    const nameCell=editing
      ?`<div class="edit-row"><input id="hn-${hb.id}" data-hid="${hb.id}" value="${esc(hb.name)}" aria-label="습관 이름"><button class="x" data-del="${hb.id}" aria-label="삭제">✕</button></div>`
      :`<span class="dot"></span>${esc(hb.name)}`;
    h+=`<tr style="--c:${color(i)}"><th class="name" title="${esc(hb.name)}">${nameCell}</th>`;
    for(let d=1;d<=n;d++){
      const on=done.has(d);
      const ang=(d*37+i*53)%3===0?'38deg':((d+i)%2?'45deg':'52deg');
      h+=`<td><button class="cell ${on?'on':''} ${isFuture(d)?'future':''}" style="--a:${ang}" data-h="${hb.id}" data-d="${d}" aria-pressed="${on}" aria-label="${esc(hb.name)} ${d}일"></button></td>`;
    }
    h+=`<td class="count">${done.size}</td></tr>`;
  });
  if(editing) h+=`<tr><th class="name" style="border:none;padding-top:8px"><button class="btn" id="addHabit">+ 습관 추가</button></th></tr>`;
  // daily sum row
  const per=dailyCounts();
  h+='<tr class="sum"><th>합계</th>';
  for(let d=1;d<=n;d++) h+=`<td>${per[d-1]||''}</td>`;
  h+='<td></td></tr></tbody>';
  $('tracker').innerHTML=h;
  $('editBtn').textContent=editing?'편집 완료':'습관 편집';
  renderCharts(per);
  renderSleep();
}

function dailyCounts(){
  const M=months[mkey()], n=dim(), arr=new Array(n).fill(0);
  habits.forEach(hb=>(M.c[hb.id]||[]).forEach(d=>{if(d<=n)arr[d-1]++}));
  return arr;
}

function renderCharts(per){
  const n=dim(), H=habits.length||1, M=months[mkey()];
  const lastDay=(view.y===now.getFullYear()&&view.m===now.getMonth())?now.getDate():(new Date(view.y,view.m,1)>now?0:n);
  const elapsed=per.slice(0,lastDay);
  const total=elapsed.reduce((a,b)=>a+b,0);
  const avg=lastDay?total/lastDay:0;
  const rate=lastDay?Math.round(total/(lastDay*H)*100):0;
  // longest run of days where every habit was kept
  let best=0,run=0; elapsed.forEach(c=>{run=(c===H&&H>0)?run+1:0;best=Math.max(best,run)});
  const bestDay=elapsed.length?Math.max(...elapsed):0;
  $('stats').innerHTML=`
    <div class="stat"><b>${rate}%</b><span>이번 달 달성률</span></div>
    <div class="stat"><b>${avg.toFixed(1)}<small style="font-size:.5em">/${H}</small></b><span>하루 평균</span></div>
    <div class="stat"><b>${bestDay}</b><span>최고 기록</span></div>
    <div class="stat"><b>${best}일</b><span>전부 지킨 연속</span></div>`;

  // bar chart
  const bw=22, padL=28, padB=26, padT=10, ch=170;
  const W=padL+n*bw+6, Ht=padT+ch+padB;
  const y=v=>padT+ch-(v/H)*ch;
  let s=`<svg viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--accent)" stroke-width="1.4"/></pattern></defs>`;
  const step=H<=6?1:H<=12?2:Math.ceil(H/6);
  for(let v=0;v<=H;v+=step){
    s+=`<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v?'2 3':'0'}"/>`;
    s+=`<text x="${padL-6}" y="${y(v)+5}" text-anchor="end" font-size="14">${v}</text>`;
  }
  const cxOf=i=>padL+i*bw+bw/2;
  const upto=lastDay||0, seen=per.slice(0,upto), peak=seen.length?Math.max(...seen):0;
  const pts=seen.map((v,i)=>[cxOf(i),y(v)]);
  if(pts.length){
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    s+=`<path d="${line} L${pts[pts.length-1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z" fill="url(#hatch)" style="opacity:.5"/>`;
    s+=`<path d="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>{
      const v=seen[i], last=i===pts.length-1;
      s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?5:3.4}" style="fill:${last?'var(--accent)':'var(--paper)'};stroke:var(--accent)" stroke-width="1.8"><title>${i+1}일: ${v}개</title></circle>`;
      if(last||(v===peak&&seen.indexOf(v)===i&&v>0)) s+=`<text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="15" style="fill:var(--ink)">${v}개</text>`;
    });
  }
  per.forEach((v,i)=>{
    const d=i+1,x=padL+i*bw+3;
    if(d===1||d%5===0||isToday(d)) s+=`<text x="${x+(bw-6)/2}" y="${Ht-6}" text-anchor="middle" font-size="14" ${isToday(d)?'style="fill:var(--accent);font-weight:700"':''}>${d}</text>`;
  });
  s+='</svg>';
  $('dayChart').outerHTML=s.replace('<svg ','<svg id="dayChart" role="img" aria-label="날짜별 지킨 습관 개수 꺾은선 그래프" ');

  // per-habit bars
  const denom=lastDay||n;
  $('habitBars').innerHTML=habits.map((hb,i)=>{
    const c=(M.c[hb.id]||[]).filter(d=>d<=denom).length;
    const p=denom?Math.round(c/denom*100):0;
    return `<div class="hbar" style="--c:${color(i)}"><span class="nm" title="${esc(hb.name)}">${esc(hb.name)}</span><span class="track"><span class="fill" style="display:block;width:${p}%"></span></span><span class="pct">${p}%</span></div>`;
  }).join('')||'<p class="hint">습관을 추가하면 여기에 달성률이 보여요.</p>';
}

function stepLabel(st){const m=S0+st*30;const hh=Math.floor(m/60)%24,mm=m%60;return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`}

function renderSleep(){
  const M=months[mkey()], n=dim();
  const cw=24, padL=44, padT=14, ch=260, padB=24;
  const W=padL+n*cw+8, Ht=padT+ch+padB;
  const y=st=>padT+st/32*ch;
  let s=`<svg id="sleepSvg" role="img" aria-label="수면 기록" viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" xmlns="http://www.w3.org/2000/svg">`;
  for(let st=0;st<=32;st+=2){
    s+=`<line x1="${padL}" x2="${W}" y1="${y(st)}" y2="${y(st)}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    const hh=(Math.floor((S0+st*30)/60))%24;
    s+=`<text x="${padL-8}" y="${y(st)+5}" text-anchor="end" font-size="14">${hh}시</text>`;
  }
  let sum=0,cnt=0;
  for(let d=1;d<=n;d++){
    const x=padL+(d-1)*cw, cx=x+cw/2, rec=M.s[d];
    s+=`<g class="col" data-sd="${d}"><rect x="${x}" y="${padT}" width="${cw}" height="${ch}" fill="transparent"/>`;
    if(rec){
      const [b,w]=rec, y1=y(b), y2=y(w);
      sum+=(w-b)*30;cnt++;
      s+=`<line x1="${cx}" x2="${cx}" y1="${y1}" y2="${y2-5}" stroke="var(--ink)" stroke-width="1.6"/>`;
      s+=`<path d="M${cx-4} ${y2-7} L${cx} ${y2} L${cx+4} ${y2-7}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`;
      s+=`<text x="${cx}" y="${y1+4}" text-anchor="middle" font-size="15" style="fill:var(--accent)">★</text>`;
      s+=`<title>${d}일 ${stepLabel(b)} → ${stepLabel(w)} (${((w-b)/2).toFixed(1)}시간)</title>`;
    }
    s+=`</g>`;
    if(d===1||d%5===0||isToday(d)) s+=`<text x="${cx}" y="${Ht-6}" text-anchor="middle" font-size="14" ${isToday(d)?'style="fill:var(--accent);font-weight:700"':''}>${d}</text>`;
  }
  s+='</svg>';
  $('sleepSvg').outerHTML=s;
  $('sAvg').textContent=cnt?`평균 ${(sum/cnt/60).toFixed(1)}시간 · ${cnt}일 기록`:'날짜 칸을 누르거나 아래에서 골라 기록하세요';
  // day select
  const sd=$('sDay'), keep=+sd.value||(isToday(now.getDate())?now.getDate():1);
  sd.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  sd.value=Math.min(keep,n); syncSleepForm();
}

function syncSleepForm(){
  const rec=months[mkey()].s[$('sDay').value];
  $('sBed').value=rec?rec[0]:8;   // 00:00
  $('sWake').value=rec?rec[1]:22; // 07:00
}

function fillTimeSelects(){
  const opts=Array.from({length:33},(_,i)=>`<option value="${i}">${stepLabel(i)}</option>`).join('');
  $('sBed').innerHTML=opts;$('sWake').innerHTML=opts;
}

/* ---------- undo / redo ---------- */
const undoStack=[], redoStack=[];
function snap(){return JSON.stringify({k:mkey(),h:habits,m:months[mkey()]})}
function pushHistory(){undoStack.push(snap());if(undoStack.length>200)undoStack.shift();redoStack.length=0;updUndo()}
function restore(str){
  const o=JSON.parse(str);
  habits=o.h; months[o.k]=o.m;
  const [, y, m]=o.k.split('-'); view={y:+y,m:+m-1};
  save('settings',{habits}); save(o.k,o.m); render(); updUndo();
}
function doUndo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop());setStatus('되돌렸어요')}
function doRedo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop());setStatus('다시 실행했어요')}
function updUndo(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length}
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return; // keep native undo while typing
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
  else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();doRedo()}
});

/* ---------- drag to paint ---------- */
let drag=null;
function paint(cell){
  const M=months[mkey()], hid=cell.dataset.h, d=+cell.dataset.d;
  const set=new Set(M.c[hid]||[]);
  if(set.has(d)===drag.on) return;
  drag.on?set.add(d):set.delete(d);
  M.c[hid]=[...set].sort((a,b)=>a-b);
  cell.classList.toggle('on',drag.on); cell.setAttribute('aria-pressed',drag.on);
  drag.changed=true;
}
$('tracker').addEventListener('pointerdown',e=>{
  const cell=e.target.closest('.cell');
  if(!cell||e.button!==0) return;
  pushHistory();
  drag={on:!cell.classList.contains('on'),changed:false,touch:e.pointerType==='touch'};
  paint(cell);
  if(!drag.touch) e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag||drag.touch) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el&&el.closest&&el.closest('.cell');
  if(cell) paint(cell);
});
function endDrag(){
  if(!drag) return;
  const changed=drag.changed; drag=null;
  if(changed){save(mkey(),months[mkey()]);render()}
  else {undoStack.pop();updUndo()}
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const cell=e.target.closest('.cell');
  if(cell){
    if(e.detail!==0) return; // mouse/touch handled by pointer events; this is keyboard
    const M=months[mkey()], hid=cell.dataset.h, d=+cell.dataset.d;
    pushHistory();
    const set=new Set(M.c[hid]||[]);
    set.has(d)?set.delete(d):set.add(d);
    M.c[hid]=[...set].sort((a,b)=>a-b);
    save(mkey(),M); render();
    const again=document.querySelector(`.cell[data-h="${hid}"][data-d="${d}"]`); again&&again.focus();
    return;
  }
  const del=e.target.closest('[data-del]');
  if(del){pushHistory();habits=habits.filter(h=>h.id!==del.dataset.del);save('settings',{habits});render();return}
  if(e.target.id==='addHabit'){pushHistory();const id=uid();habits.push({id,name:'새 습관'});save('settings',{habits});render();const inp=$('hn-'+id);inp&&(inp.focus(),inp.select());return}
  const col=e.target.closest('[data-sd]');
  if(col){$('sDay').value=col.dataset.sd;syncSleepForm();$('sBed').focus()}
});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.hid)pushHistory()});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.hid){
    const hb=habits.find(h=>h.id===e.target.dataset.hid); if(hb){hb.name=e.target.value.trim()||'이름 없음';save('settings',{habits})}
  }
});

/* ---------- backup (standalone) ---------- */
$('exportBtn').onclick=()=>{
  const data={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('ht:'))data[k]=JSON.parse(localStorage.getItem(k))}}catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=`habit-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('importFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    Object.entries(data).forEach(([k,v])=>{if(k.startsWith('ht:'))localStorage.setItem(k,JSON.stringify(v))});
    location.reload();
  }catch(err){setStatus('백업 파일을 읽지 못했어요')}
};
$('undoBtn').onclick=doUndo; $('redoBtn').onclick=doRedo;
$('editBtn').onclick=()=>{editing=!editing;render()};
$('prev').onclick=async()=>{view.m--;if(view.m<0){view.m=11;view.y--}await ensureMonth();render()};
$('next').onclick=async()=>{view.m++;if(view.m>11){view.m=0;view.y++}await ensureMonth();render()};
$('sDay').onchange=syncSleepForm;
$('sleepForm').onsubmit=e=>{
  e.preventDefault();
  let b=+$('sBed').value,w=+$('sWake').value;
  if(w<=b){$('sAvg').textContent='일어난 시간이 잠든 시간보다 늦어야 해요';return}
  pushHistory();const M=months[mkey()];M.s[$('sDay').value]=[b,w];save(mkey(),M);renderSleep();
};
$('sClear').onclick=()=>{pushHistory();const M=months[mkey()];delete M.s[$('sDay').value];save(mkey(),M);renderSleep()};

/* ---------- boot ---------- */
async function boot(){
  fillTimeSelects();
  // quick first paint from this browser's copy
  const local=lsGet('settings');
  habits=(local&&local.habits)||DEFAULT_HABITS.map(n=>({id:uid(),name:n}));
  months[mkey()]=lsGet(mkey())||{c:{},s:{}};
  render();
  await initStore();
  if(store.kind==='db'){
    for(const k in months) delete months[k];
    const st=await load('settings');
    if(st&&Array.isArray(st.habits)) habits=st.habits;
    else save('settings',{habits});
    await ensureMonth();
    setStatus('내 계정에 저장돼요');
  }else{
    if(!local) lsSet('settings',{habits});
    setStatus('이 브라우저에 저장돼요 · 가끔 백업해 두세요');
  }
  render();
}
boot();
})();
</script>
